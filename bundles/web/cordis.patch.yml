# Tack's web app composition, over the runtime's web bundle.

# ── Command line ─────────────────────────────────────────────────────────────
# Tack owns `tack web --help` and its usage errors: the runtime's startup row
# is disabled and a Tack row providing the same `webStartup` service inserted.
- id: web-startup
  disabled: true

- insert:
    - id: tack-web-startup
      name: '@tack/plugins/web-startup'

# ── DeepSeek product policy: off ─────────────────────────────────────────────
# DeepSeek account page and its host controller.
- id: account-controller
  disabled: true

- id: ui-settings-account
  disabled: true

# Product usage analytics and its OTLP export (desktop profile upstream; off
# everywhere in Tack).
- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

# The setting that uploads session logs with DeepSeek API requests; the upload
# itself (session-log-deepseek) is off in @tack/base.
- id: ui-settings-session-log
  disabled: true

# Message feedback (like/dislike records).
- id: message-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true

# The upstream brand. Tack's own chrome replaces it.
- id: ui-brand-official
  disabled: true

# ── Workspaces ───────────────────────────────────────────────────────────────
# The first-use default workspace lives under Tack's home (the runtime maps
# TACK_HOME onto DSH_HOME), never in the user's Documents folder, and works on
# systems without one.
- id: workspace-controller
  config:
    documentsDirectory: !!js "process.env.DSH_HOME + (process.platform === 'win32' ? '\\\\' : '/') + 'workspaces'"

# ── Tack chrome ──────────────────────────────────────────────────────────────
- insert:
    - id: tack-web-chrome
      name: '@tack/web-chrome'
      # Settings: product, brand, Tailwind 4 theme, splash, welcome, version.
      # `tack web --chrome <file>` or `$TACK_HOME/web-chrome.json` fills this
      # row's config for one run; a profile patch can set it permanently.
      config: {}

# Runtime rows driven by the chrome settings. These are defaults at the bundle
# layer: a choice the user saves in settings lands in the profile layer and wins.
- id: ui-theme
  inject: [tackChrome]
  config:
    preference: !!js ctx.tackChrome.theme.appearance

- id: ui-settings-models
  inject: [tackChrome]
  config:
    credentialOnboarding: !!js ctx.tackChrome.onboarding.credentialPrompt

# ── Supervise preset ─────────────────────────────────────────────────────────
# A session preset next to the runtime's own (standard, ptc, minimal, cordis).
# A supervising agent answers, reads, and delegates workspace work to a
# delegated agent runtime (installed as a plugin, e.g. @tack/agent-claude)
# instead of editing files or running commands itself: no shell, no
# in-process subagents or workflows, and `write`/`edit` masked below.
- insert:
    - id: preset-supervise
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: supervise
        name: Supervise
        description: Plans, reads, and delegates changes to an agent such as Claude; never edits or runs commands itself.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Tack, a supervising agent powered by the {{model}}
                model. You answer questions, read the workspace for context,
                and delegate work. You do not edit files or run commands
                yourself: hand any task that changes the workspace or needs
                commands (code changes, debugging, running tests, scripted
                analysis, producing files) to a delegated agent with the
                `delegate` tool, giving it a complete, self-contained task and
                how to verify it. Report the delegated agent's outcome to the
                user accurately, including failures. Answer directly when no
                work is needed. Delegate long work in the background and keep
                helping; when its completion notice arrives, read the report
                with job_output and tell the user the outcome.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # job_list / job_output / job_kill, and the controller that serves
          # background delegations and wakes the supervisor when one finishes.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # Each agent names a registered subagent provider; the tool lists
          # only the agents whose provider is installed in this profile.
          - id: tack-delegate
            name: '@tack/delegate'
            config:
              # The web host outlives a turn, so delegations may run as jobs.
              background: true
              agents:
                claude:
                  provider: claude
                  description: >-
                    Claude, an autonomous workspace agent (Claude Agent SDK).
                    Best for software work (inspect, edit, debug, run and fix
                    tests) and for other multi-step work in the workspace:
                    research, data wrangling, scripted analysis, drafting files.

    # `write` and `edit` share their row with `read`; hide them from
    # Supervise sessions only.
    - id: tack-supervise-tool-mask
      name: '@tack/plugins/tool-mask'
      config:
        preset: supervise
        deny: [write, edit]

    # The delegate card in the browser. The runtime serves a package's
    # browser half for its root rows only, so @tack/delegate is mounted here
    # once more with no agents: it registers no tool, it only loads the card.
    - id: tack-delegate-view
      name: '@tack/delegate'
      config:
        agents: {}
