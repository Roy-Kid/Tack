name: CI

on:
  push:
  pull_request:

env:
  DSH_TELEMETRY_DISABLED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build first: the CLI type-checks against @tack/web-chrome's generated declarations.
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Browser tests (web chrome)
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:e2e
